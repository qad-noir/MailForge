services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lead_sender
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_sender"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    command: python -m app.workers.sender
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    env_file: .env
    command: python -m app.workers.scheduler --loop --interval 30
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:

